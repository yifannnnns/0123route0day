
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>象山〇号公路 | 数字文旅</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- 引入腾讯地图 API -->
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00E0EF",
                        secondary: "#3B82F6", 
                        accent: "#0F172A",
                        "background-dark": "#F8FAFC"
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'sans-serif']
                    },
                    backgroundImage: {
                        'cyan-blue-gradient': 'linear-gradient(135deg, #00E0EF 0%, #3B82F6 100%)',
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --iphone-width: 410px;
            --iphone-height: 890px;
        }

        .glass-circle {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.4);
        }
        .main-hub-shadow {
            box-shadow: 0 10px 40px rgba(0, 224, 239, 0.25);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .route-glow {
            filter: drop-shadow(0 0 8px rgba(0, 224, 239, 0.5));
        }
        .logo-glow-active {
            filter: drop-shadow(0 0 10px rgba(0, 224, 239, 0.8));
        }
        
        /* iPhone 17 Simulation Container */
        body {
            background-color: #0F172A;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        #root {
            width: var(--iphone-width);
            height: var(--iphone-height);
            background: #F8FAFC;
            position: relative;
            border-radius: 55px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5), 0 30px 60px -30px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 8px solid #1e293b;
            /* Scale on smaller screens */
            transform-origin: center;
        }

        @media (max-width: 500px), (max-height: 900px) {
            #root {
                transform: scale(0.9);
            }
        }
        
        @media (max-width: 420px) {
            #root {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                transform: none;
            }
        }

        .iphone-safe-area-bottom {
            height: 34px;
            width: 100%;
            position: absolute;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1000;
        }

        .home-indicator {
            width: 140px;
            height: 5px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 5s ease-in-out infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <div class="iphone-safe-area-bottom">
        <div class="home-indicator"></div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
